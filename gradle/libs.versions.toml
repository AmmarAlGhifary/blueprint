[versions]
# The newest AGP and Gradle inside the range Kotlin 2.4.21 documents as tested (AGP up to 9.3.1, Gradle up to 9.7.0).
agp = "9.5.3"
kotlin = "2.4.21"
# The consumer floor: the previous Kotlin minor. kotlinLanguage is the languageVersion/apiVersion the
# libraries compile at, and kotlinStdlibFloor the kotlin-stdlib their published POMs declare. Move both
# together with the compiler above. kotlinx-serialization must not require a newer stdlib than this.
kotlinLanguage = "2.3"
kotlinStdlibFloor = "2.3.21"
binaryCompatibilityValidator = "0.18.2"
# The Compose floors: consumers must meet them, so raise them only on purpose. :core takes Compose
# Multiplatform, which resolves to androidx Compose 1.11.2 on Android; composeBom is the BOM of that same
# release for :defaults and the sample. 1.12 would force consumers to compileSdk 37 and AGP 9.1.
composeMultiplatform = "1.11.1"
composeBom = "2026.05.01"
# Tests only, so the render tests exercise current Compose.
composeBomLatest = "2026.06.01"
kotlinxSerialization = "1.11.0"
activityCompose = "1.9.3"
coil = "2.7.0"
junit = "4.13.2"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
# Publishing only; they never reach a consumer.
mavenPublish = "0.37.0"
# Builds the javadoc jar Maven Central requires. The plugin uses it automatically when it is applied.
dokka = "2.3.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-bom-latest = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBomLatest" }
compose-multiplatform-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-multiplatform-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-multiplatform-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
