[versions]
agp = "8.13.2"
kotlin = "2.2.10"
# The kotlin-stdlib the published POMs declare, which is what a consumer's build resolves. It matches the
# language/API level (2.0) so a consumer on a Kotlin 2.0 compiler can read it; the stdlib the compiler
# would otherwise add (2.2.10) has newer metadata that a 2.0 compiler rejects. Not a compiler version.
kotlinStdlibFloor = "2.0.21"
binaryCompatibilityValidator = "0.18.1"
# The Compose floor (runtime 1.7.0): consumers must meet it, so raise it only on purpose.
composeBom = "2024.09.00"
# Tests only, so the render tests exercise current Compose.
composeBomLatest = "2026.06.01"
kotlinxSerialization = "1.12.0"
activityCompose = "1.9.3"
coil = "2.4.0"
junit = "4.13.2"
robolectric = "4.16.1"
androidxTestCore = "1.6.1"
sonarqube = "7.5.0.8588"
# Publishing only; they never reach a consumer. 0.37.0 is the latest stable and needs Gradle 9.0, AGP 8.13
# and Kotlin 2.2 or newer, all of which this build already meets (Gradle 9.3.1, AGP 8.13.2, Kotlin 2.2.10).
mavenPublish = "0.37.0"
# Builds the javadoc jar Maven Central requires. The plugin uses it automatically when it is applied.
dokka = "2.2.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-bom-latest = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBomLatest" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
