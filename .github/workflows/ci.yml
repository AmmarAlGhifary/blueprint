name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25), so Gradle does not download a JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Public API unchanged, or the dumps refreshed with apiDump.
      - name: API check
        run: ./gradlew apiCheck

      - name: Unit tests
        run: ./gradlew :core:testDebugUnitTest :defaults:testDebugUnitTest

      # The old-Compose floor and explicitApi() are enforced by compiling the release libraries.
      - name: Release libraries
        run: ./gradlew :core:assembleRelease :defaults:assembleRelease

      - name: Sample app
        run: ./gradlew :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            defaults/build/reports/tests
          if-no-files-found: ignore

  # A tiny app outside the main build compiles against the *published* libraries on several Kotlin versions,
  # to catch what the library's own build cannot: a POM that pulls a newer stdlib, or a signature an older
  # compiler cannot read. See consumer-test/README.md.
  consumer:
    name: consumer, ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A row marked experimental may fail without failing the workflow; its failure still shows in the job list.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fails on develop today: Kotlin 2.0.21's Compose compiler crashes ("Unknown file") on any consumer
          # call to an abstract @Composable member of SduiScope (Render, RenderAll). Set experimental: false
          # once the SduiScope fix (feature/sduiscope-no-defaults) has merged.
          - name: Kotlin 2.0.21
            props: -Pkotlin=2.0.21
            experimental: true
          - name: Kotlin 2.2.10
            props: -Pkotlin=2.2.10
            experimental: false
          # What the library itself is built with: Kotlin 2.2.10 at language and API level 2.0.
          - name: Kotlin 2.2.10, language 2.0
            props: -Pkotlin=2.2.10 -Planguage=2.0
            experimental: false
          # Passes today. Kept non-blocking until the SduiScope fix has merged; then set experimental: false.
          - name: Kotlin 2.4.21, language 2.0
            props: -Pkotlin=2.4.21 -Planguage=2.0
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish the libraries to Maven Local
        run: ./gradlew :core:publishToMavenLocal :defaults:publishToMavenLocal

      - name: Compile the consumer (${{ matrix.name }})
        run: ./gradlew -p consumer-test :app:compileDebugKotlin ${{ matrix.props }} -Pandroid.useAndroidX=true
