name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25), so Gradle does not download a JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Public API unchanged, or the dumps refreshed with apiDump.
      - name: API check
        run: ./gradlew apiCheck

      - name: Unit tests
        run: ./gradlew :core:testAndroidHostTest :core:desktopTest :defaults:testAndroidHostTest :defaults:desktopTest :actions:testAndroidHostTest :actions:desktopTest

      # The old-Compose floor and explicitApi() are enforced by compiling the release libraries. assemble covers
      # every target, the iOS klibs included (they cross-compile on Linux).
      - name: Release libraries
        run: ./gradlew :core:assemble :defaults:assemble :actions:assemble

      - name: Sample app
        run: ./gradlew :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            defaults/build/reports/tests
            actions/build/reports/tests
          if-no-files-found: ignore

  # A tiny app outside the main build compiles against the *published* libraries on several Kotlin versions,
  # to catch what the library's own build cannot: a POM that pulls a newer stdlib, or a signature an older
  # compiler cannot read. Every row gates. See consumer-test/README.md.
  consumer:
    name: consumer, ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor: the published POMs pin kotlin-stdlib to this minor, the oldest Kotlin supported.
          - name: Kotlin 2.3.21
            props: -Pkotlin=2.3.21
          # The latest stable Kotlin, which the libraries themselves are built with.
          - name: Kotlin 2.4.21
            props: -Pkotlin=2.4.21
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish the libraries to Maven Local
        run: ./gradlew :core:publishToMavenLocal :defaults:publishToMavenLocal :actions:publishToMavenLocal

      - name: Compile the consumer (${{ matrix.name }})
        run: ./gradlew -p consumer-test :app:compileDebugKotlin ${{ matrix.props }} -Pandroid.useAndroidX=true

  # Linking and running iOS tests needs Xcode, so this is the one job that cannot run on Linux.
  ios:
    name: iOS simulator tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Library tests on the iOS simulator
        run: ./gradlew :core:iosSimulatorArm64Test :defaults:iosSimulatorArm64Test :actions:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: |
            core/build/reports/tests
            defaults/build/reports/tests
            actions/build/reports/tests
          if-no-files-found: ignore
